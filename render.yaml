services:
  - type: web
    name: phoenix-hub-api
    env: docker
    # Se quiser que Render construa a imagem a partir do repo, especifique o caminho do Dockerfile:
    dockerfilePath: apps/api/Dockerfile
    # Branch que o Render deve acompanhar / auto-deploy:
    branch: main
    # Porta que o container expõe (uvicorn no Dockerfile usa 8000)
    envVars:
      - key: PORT
        value: "8000"
      # adicione DEV_TOKEN via UI como secret (ver instruções abaixo)
    plan: free
    # health check path (HTTP)
    healthCheckPath: /health
