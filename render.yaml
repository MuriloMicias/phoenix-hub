services:
  - type: web
    name: phoenix-hub-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Phoenix Hub"
      - key: APP_VERSION
        value: "0.1.0"
      - key: SERVICE_NAME
        value: "phoenix-hub-api"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: DEV_USER
        value: "admin"
      - key: DEV_PASSWORD
        generateValue: true
      - key: DEV_TOKEN
        generateValue: true
