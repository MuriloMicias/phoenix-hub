name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/src/requirements.txt ]; then
            pip install -r apps/api/src/requirements.txt
          else
            pip install fastapi[all] pytest httpx pydantic pydantic-settings
          fi

      - name: Run tests
        run: |
          PYTHONPATH=apps/api/src pytest -q
